<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>PackCheck</title>
<link rel="stylesheet" href="/static/packcheck.css?v=4">
<link rel="icon" href="/static/favicon.svg" type="image/svg+xml">
</head>
<body>
<div id="app-bar" data-nav="none"></div>

<main class="page narrow">
  <section id="login"></section>

  <div class="card done-screen" id="no-session" hidden>
    <span class="status-icon warn" data-icon="scan"></span>
    <h2 data-t="phone.no_session_title">Scan the code first</h2>
    <p data-t="phone.no_session"></p>
  </div>

  <!-- One scan = one pack = two photos. Nothing is sent until both are taken, so the
       computer always gets a front AND a back to check together. Each slot is a <label>
       for a hidden file input: tapping anywhere on it opens the camera (capture="environment"
       = the back camera; on a computer it is a file picker). -->
  <section id="capture" hidden>
    <span class="phone-status" data-t="phone.connected">Connected to the computer</span>
    <div class="page-head phone-head">
      <h1 data-t="phone.title" data-t-title="page.phone_title">Photograph the pack</h1>
      <p data-t="phone.intro"></p>
    </div>

    <div class="slots">
      <input id="photo-front" type="file" accept="image/*" capture="environment">
      <label class="slot" for="photo-front" id="slot-front">
        <img alt="" hidden>
        <span data-icon="camera"></span>
        <span class="slot-face" data-t="desk.face.front">Front</span>
        <span class="slot-hint" data-t="phone.tap">Tap to take the photo</span>
        <span class="slot-done" hidden></span>
      </label>
      <input id="photo-back" type="file" accept="image/*" capture="environment">
      <label class="slot" for="photo-back" id="slot-back">
        <img alt="" hidden>
        <span data-icon="camera"></span>
        <span class="slot-face" data-t="desk.face.back">Back</span>
        <span class="slot-hint" data-t="phone.tap">Tap to take the photo</span>
        <span class="slot-done" hidden></span>
      </label>
    </div>
    <p class="hint" data-t="capture.hint"></p>

    <div id="inspector-block">
      <label for="inspector" data-t="capture.inspector">Your name</label>
      <input id="inspector" type="text" autocomplete="name">
    </div>

    <div class="sticky-send">
      <button class="button block large" id="send" type="button" disabled data-t="phone.send">Send</button>
      <p class="hint" id="need-both" data-t="phone.need_both"></p>
      <p class="hint" id="quality-hint" data-t="phone.quality.hint" hidden></p>
    </div>
  </section>

  <section class="card done-screen" id="checking" hidden role="status">
    <span class="status-icon busy">
      <svg class="spinner" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><circle cx="12" cy="12" r="6.5"/><path d="M12 1.5v21M1.5 12h21"/></svg></span>
    <h2 data-t="phone.sending">Sending and checking…</h2>
    <p data-t="desk.checking_hint"></p>
  </section>

  <!-- When the photos do not point to exactly one artwork: never guess, ask. The same two
       photos are sent again with the artwork the worker tapped. -->
  <section class="card" id="chooser" hidden>
    <p class="verdict retake" id="chooser-title"></p>
    <div class="candidates" id="candidates"></div>
  </section>

  <section class="card done-screen" id="sent" hidden>
    <span class="status-icon" data-icon="check"></span>
    <h2 data-t="phone.sent_title">Sent!</h2>
    <p data-t="phone.sent"></p>
    <button class="button block large" id="next" type="button" data-icon="camera" data-t="phone.next">Scan another pack</button>
  </section>
</main>

<script src="/static/common.js?v=4"></script>
<script>
  const Phone = { sessionId: new URLSearchParams(location.search).get("session"), photos: { front: null, back: null },
                  problems: { front: [], back: [] } };   // what /api/photos/check found in each photo

  for (const face of ["front", "back"]) {
    $(`photo-${face}`).addEventListener("change", async (event) => {
      const file = event.target.files[0];
      event.target.value = "";
      if (!file) return;
      Phone.photos[face] = file;
      Phone.problems[face] = [];
      const slot = $(`slot-${face}`);
      const img = slot.querySelector("img");
      img.src = URL.createObjectURL(file);
      img.hidden = false;
      slot.classList.add("done");
      slot.classList.remove("warn");
      slot.querySelector(".slot-done").textContent = t("phone.quality.checking");
      slot.querySelector(".slot-done").hidden = false;
      updateSend();

      // Check the photo now, while the pack is still in the worker's hands, so a blurry or
      // dark one is retaken here instead of failing later on the computer.
      const problems = await checkPhoto(file);
      if (Phone.photos[face] !== file) return;   // retaken while checking: the newer photo's check wins
      Phone.problems[face] = problems;
      slot.classList.toggle("warn", problems.length > 0);
      // Only the first problem is shown: the server lists the likely cause first (see photo_quality.py).
      slot.querySelector(".slot-done").textContent = problems.length
        ? t("phone.quality." + problems[0].code)
        : "✓ " + t("desk.face." + face) + " · " + t("phone.tap_retake");
      updateSend();
    });
  }

  async function checkPhoto(file) {
    // The check only warns, so it must never stop a worker from sending: if it fails (no
    // network, server error, a photo the server cannot read) the photo is treated as unchecked.
    try {
      const form = new FormData();
      form.append("photo", file);
      const response = await fetch("/api/photos/check", { method: "POST", body: form });
      if (!response.ok) return [];
      return (await response.json()).problems;
    } catch (error) {
      return [];
    }
  }

  function updateSend() {
    const ready = Boolean(Phone.photos.front && Phone.photos.back);
    $("send").disabled = !ready;
    $("need-both").hidden = ready;
    // A warned photo can still be sent (the limits are not tuned on real photos yet; the
    // worker may judge it fine), but the button says so. data-t keeps it right if the language changes.
    const warned = Phone.problems.front.length > 0 || Phone.problems.back.length > 0;
    $("send").dataset.t = warned ? "phone.quality.send_anyway" : "phone.send";
    $("send").textContent = t($("send").dataset.t);
    $("quality-hint").hidden = !warned;
  }

  $("send").addEventListener("click", () => send(null));

  async function send(pack) {
    if (!mayAct()) { alert(t("error.not_signed_in")); return; }
    remember("inspector", $("inspector").value);
    show("checking");
    const form = new FormData();
    form.append("front", Phone.photos.front);
    form.append("back", Phone.photos.back);
    form.append("session_id", Phone.sessionId);
    form.append("inspector", $("inspector").value);
    if (pack) form.append("pack", pack);
    try {
      const response = await fetch("/api/packs/inspect", { method: "POST", body: form });
      const body = await response.json();
      if (!response.ok) throw new Error(body.detail || t("error.generic"));
      if (body.status === "identify_ambiguous" || body.status === "identify_failed") return showChooser(body);
      show("sent");
    } catch (error) {
      alert(error.message);
      show("capture");
    }
  }

  function showChooser(body) {
    $("chooser-title").textContent = body.candidates.length ? t("phone.ambiguous") : t("phone.failed");
    $("candidates").innerHTML = "";
    for (const candidate of body.candidates) {
      const button = document.createElement("button");
      button.type = "button";
      button.className = "button block large";
      button.textContent = candidate.name;
      button.addEventListener("click", () => send(candidate.pack));
      $("candidates").append(button);
    }
    const retake = document.createElement("button");
    retake.type = "button";
    retake.className = "button block secondary";
    retake.textContent = t("phone.retake_both");
    retake.addEventListener("click", () => show("capture"));
    $("candidates").append(retake);
    show("chooser");
  }

  function show(section) {
    for (const id of ["capture", "checking", "chooser", "sent"]) $(id).hidden = id !== section;
    window.scrollTo(0, 0);
  }

  $("next").addEventListener("click", () => {
    Phone.photos = { front: null, back: null };
    Phone.problems = { front: [], back: [] };
    for (const face of ["front", "back"]) {
      const slot = $(`slot-${face}`);
      slot.querySelector("img").hidden = true;
      slot.querySelector("img").removeAttribute("src");
      slot.querySelector(".slot-done").hidden = true;
      slot.classList.remove("done", "warn");
    }
    updateSend();
    show("capture");
  });

  document.addEventListener("loginchange", () => {
    $("inspector-block").hidden = Boolean(Login.user);   // the login already says who you are
  });

  (async () => {
    mountAppBar();
    await loadStrings();
    wireLanguageButtons();
    wireLogin();
    $("inspector").value = recall("inspector");
    await refreshLogin();
    if (!Phone.sessionId) { $("no-session").hidden = false; return; }
    // Tell the computer this phone is here: its screen switches from the QR code to "connected".
    const response = await fetch(`/api/sessions/${encodeURIComponent(Phone.sessionId)}/connect`, { method: "POST" });
    if (!response.ok) { $("no-session").hidden = false; return; }
    show("capture");
    updateSend();
  })();
</script>
</body>
</html>
