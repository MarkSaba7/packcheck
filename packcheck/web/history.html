<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PackCheck history</title>
<link rel="stylesheet" href="/static/packcheck.css?v=3">
<link rel="icon" href="/static/favicon.svg" type="image/svg+xml">
</head>
<body>
<div id="app-bar" data-active="history"></div>

<main class="page">
  <div class="page-head">
    <h1 data-t="page.history_title" data-t-title="page.history_title">Scan history</h1>
    <p data-t="history.intro"></p>
  </div>

  <div class="toolbar">
    <nav class="segmented">
      <a href="?range=day" data-range="day" data-t="history.day">Today</a>
      <a href="?range=week" data-range="week" data-t="history.week">This week</a>
      <a href="?range=month" data-range="month" data-t="history.month">This month</a>
    </nav>
    <a class="button secondary" href="/desk" data-icon="scan" data-t="home.scan">Start scanning</a>
  </div>

  <div class="stats four" id="summary">
    <div class="stat"><b id="count-all">–</b><span data-t="home.stat_scans">Scans</span></div>
    <div class="stat accepted"><b id="count-accepted">–</b><span data-t="home.stat_accepted">Accepted</span></div>
    <div class="stat refused"><b id="count-refused">–</b><span data-t="home.stat_refused">Refused</span></div>
    <div class="stat pending"><b id="count-pending">–</b><span data-t="home.stat_pending">To review</span></div>
  </div>

  <section class="card">
    <div class="empty" id="none" hidden><span data-icon="inbox"></span><span data-t="history.none"></span></div>
    <div class="table-wrap" id="table" hidden>
      <table class="table">
        <thead><tr><th data-t="history.when"></th><th data-t="history.product"></th><th data-t="history.by"></th>
          <th data-t="history.form"></th><th></th></tr></thead>
        <tbody id="rows"></tbody>
      </table>
    </div>
  </section>
</main>

<script src="/static/common.js?v=3"></script>
<script>
  const range = new URLSearchParams(location.search).get("range") || "day";
  let packs = [];

  function render() {
    for (const tab of document.querySelectorAll("[data-range]")) tab.setAttribute("aria-current", String(tab.dataset.range === range));
    const count = (verdict) => packs.filter((pack) => pack.verdict === verdict).length;
    $("count-all").textContent = packs.length;
    $("count-accepted").textContent = count("accepted");
    $("count-refused").textContent = count("refused");
    $("count-pending").textContent = count("pending");

    $("none").hidden = packs.length > 0;
    $("table").hidden = packs.length === 0;
    $("rows").innerHTML = "";
    for (const pack of packs) {
      const tr = document.createElement("tr");
      tr.innerHTML = `<td></td><td class="product"><b></b><span></span></td><td></td><td><span class="pill ${pack.verdict}"></span></td>
        <td class="actions-cell"><a class="button small secondary" target="_blank" rel="noopener"></a><a class="button small secondary" target="_blank" rel="noopener"></a></td>`;
      tr.children[0].textContent = (pack.created_at || "").replace("T", " ").slice(0, 16);
      tr.querySelector(".product b").textContent = pack.product_name;
      tr.querySelector(".product span").textContent = pack.product_code;
      tr.children[2].textContent = pack.inspector || "—";
      tr.querySelector(".pill").textContent = t("r79.verdict." + pack.verdict);
      const [view, print] = tr.querySelectorAll("a");
      view.href = `/report/pack/${pack.pack_id}?lang=${Strings.language}`;
      view.innerHTML = `${icon("report")}<span>${t("history.view")}</span>`;
      print.href = `/report/pack/${pack.pack_id}?lang=${Strings.language}&print=1`;
      print.innerHTML = `${icon("print")}<span>${t("history.print")}</span>`;
      $("rows").append(tr);
    }
  }

  document.addEventListener("languagechange", render);

  (async () => {
    mountAppBar();
    await loadStrings();
    wireLanguageButtons();
    packs = await (await fetch(`/api/packs?range=${encodeURIComponent(range)}`)).json();
    render();
  })();
</script>
</body>
</html>
